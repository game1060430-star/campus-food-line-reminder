services:
  - type: web
    name: campus-food-line-reminder
    env: docker
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_MODULE
        value: app.line_reminder:app
      - key: DATABASE_URL
        fromDatabase:
          name: campus-food-line-db
          property: connectionString
      - key: APP_BASE_URL
        sync: false
      - key: WEB_ACCESS_TOKEN
        sync: false
      - key: LINE_CHANNEL_SECRET
        sync: false
      - key: LINE_CHANNEL_ACCESS_TOKEN
        sync: false

  - type: cron
    name: campus-food-line-upload-reminders
    env: docker
    plan: starter
    schedule: "0 20 * * *"
    dockerCommand: python scripts/send_upload_reminders.py
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_MODULE
        value: app.line_reminder:app
      - key: DATABASE_URL
        fromDatabase:
          name: campus-food-line-db
          property: connectionString
      - key: APP_BASE_URL
        sync: false
      - key: WEB_ACCESS_TOKEN
        sync: false
      - key: LINE_CHANNEL_SECRET
        sync: false
      - key: LINE_CHANNEL_ACCESS_TOKEN
        sync: false

databases:
  - name: campus-food-line-db
    plan: starter
