{% extends 'base.html' %}{% block content %}<h1>營業日／菜單排程</h1><form method="get" class="card form"><label>分店<select name="branch_id" onchange="this.form.submit()"><option value="">請選擇</option>{% for b in branches %}<option value="{{b.id}}" {% if branch_id==b.id %}selected{% endif %}>{{b.name}}</option>{% endfor %}</select></label></form>{% if branch_id %}<form method="post" action="/menu/add-range" class="card form"><input type="hidden" name="branch_id" value="{{branch_id}}"><label>菜色*<select name="recipe_id" required>{% for r in recipes %}<option value="{{r.id}}">{{r.name}}</option>{% endfor %}</select></label><label>開始日期*<input type="date" name="start_date" required></label><label>結束日期*<input type="date" name="end_date" required></label><label>供應份數（選填）<input type="number" name="servings"></label><label>營業日<select name="weekdays"><option value="0,1,2,3,4">週一～週五</option><option value="0,1,2,3,4,5">週一～週六</option><option value="0,1,2,3,4,5,6">每天</option></select></label><button>套用到日期區間</button></form><h2>已排菜單</h2>{% for m in items %}<div class="row"><span>{{m.service_date}}　{{recipe_map[m.recipe_id].name}}</span><span>{{m.upload_state}}</span></div>{% endfor %}{% endif %}{% endblock %}
